plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'cz.ideamirror.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cz.ideamirror.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.7.0'
    }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation files('libs/zxing-core-3.5.3.jar') }
